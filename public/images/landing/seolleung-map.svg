<svg width="1200" height="430" viewBox="0 0 1200 430"
  xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12"
        flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>

  <!-- 보조 도로 -->
  <path d="M120 90 H1080"
    stroke="#d7e0eb" stroke-width="18"
    stroke-linecap="round"/>

  <path d="M260 55 V350"
    stroke="#d7e0eb" stroke-width="14"
    stroke-linecap="round"/>

  <path d="M820 65 V350"
    stroke="#d7e0eb" stroke-width="14"
    stroke-linecap="round"/>

  <!-- 테헤란로 -->
  <path d="M70 295 H1130"
    stroke="#23bd66" stroke-width="16"
    stroke-linecap="round"/>

  <text x="915" y="330"
    font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, sans-serif"
    font-size="20" font-weight="700" fill="#64748b">
    테헤란로
  </text>

  <!-- 선릉역 1번출구 -->
  <circle cx="475" cy="295" r="35"
    fill="#facc15" filter="url(#shadow)"/>

  <text x="475" y="303"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, sans-serif"
    font-size="22" font-weight="900" fill="#0f172a">
    1
  </text>

  <text x="475" y="365"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, sans-serif"
    font-size="27" font-weight="900" fill="#0f172a">
    선릉역 1번 출구
  </text>

  <!-- 이동경로 -->
  <path d="M505 275 C570 240, 610 205, 670 170"
    stroke="#f97316"
    stroke-width="9"
    stroke-linecap="round"
    stroke-dasharray="15 13"
    fill="none"/>

  <!-- 목적지 -->
  <rect x="650" y="105"
    width="310" height="140"
    rx="22"
    fill="#2563eb"
    filter="url(#shadow)"/>

  <circle cx="695" cy="175" r="18" fill="#ef4444"/>
  <circle cx="695" cy="175" r="6" fill="#ffffff"/>

  <text x="735" y="160"
    font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, sans-serif"
    font-size="26" font-weight="900" fill="#ffffff">
    샹제리제센터
  </text>

  <text x="735" y="200"
    font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, sans-serif"
    font-size="21" font-weight="750" fill="#dbeafe">
    A동 406호 · 4층
  </text>

  <text x="70" y="58"
    font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, sans-serif"
    font-size="17" font-weight="800" fill="#2563eb"
    letter-spacing="3">
    SEOLLEUNG
  </text>
</svg>
