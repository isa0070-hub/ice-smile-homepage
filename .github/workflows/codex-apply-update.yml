name: Apply staged site update

on:
  push:
    branches:
      - isa0070-hub-patch-1
    paths:
      - .github/workflows/codex-apply-update.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: isa0070-hub-patch-1
          fetch-depth: 0

      - name: Verify and apply the reviewed archive
        run: |
          echo "b062998b4a37b5b8e6c08286c2280c2bf950357eead4ac3d68ee0542c7806829  codex-update-20260807.tar.gz" | sha256sum -c -
          tar -xzf codex-update-20260807.tar.gz
          rm -f codex-update-20260807.tar.gz
          rm -f middleware.js
          rm -f src/app/api/send-telegram/route.js
          rm -f src/app/admin/page_backup_before_repair_cases.js
          rm -f .github/workflows/codex-apply-update.yml

      - name: Commit the verified update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply SEO, performance, and security update"
          git push origin HEAD:isa0070-hub-patch-1
